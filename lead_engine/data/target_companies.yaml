# Real target companies for lead_engine's career-pages scraper.
#
# Sourced via web research (2026-09-09), independently verified: mid-size
# (not Jabil/Flex/Benchmark-scale) US-based precision manufacturers with a
# real, public careers page, doing robotic/precision assembly work
# (electronics, medical device, or precision mechanical assembly) - the
# kind of shop that would plausibly be hiring Quality Engineers,
# Manufacturing Engineers, or Process Engineers.
#
# Run with: python main.py targets data/target_companies.yaml
#
# Dropped during research (see chat history for why): Providien (now a
# Carlisle Companies subsidiary - not mid-size independent), Interplex
# (Singapore HQ, not US-based), Minnetronix Medical (careers URL 404'd,
# needs a manual check before adding).
#
# Dropped after the first real `targets` run (2026-09-09): Firstronic LLC
# (firstronic.com 302-redirects to a GoDaddy "domain for sale" parking
# page - confirmed independently, not a scraper fluke - the domain has
# lapsed; if the company still operates under a different domain, re-add
# it with the correct URL).

