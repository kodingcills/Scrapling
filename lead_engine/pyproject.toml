[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-engine"
version = "0.1.0"
description = "Lead-gen scraping toolkit (career pages, integrator directories, team pages, Notion sync) built on the tailored Scrapling fork."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scrapling[all]",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lead_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
# Pin scrapling to the local tailored fork (repo root, one level up) instead
# of PyPI, regardless of install order or which tool builds the venv. This
# is the actual fix for the old requirements.txt convention below, which
# only worked if `pip install -r requirements.txt` happened to run before
# `pip install -e .` - `uv sync` run from inside lead_engine/ never went
# through that file and silently resolved real PyPI scrapling instead,
# which has none of this fork's own fetchers (LeadEngineFetcher, capture_xhr
# defaults, etc.) and breaks with `ModuleNotFoundError:
# scrapling.fetchers.lead_engine`.
scrapling = { path = "..", editable = true }
